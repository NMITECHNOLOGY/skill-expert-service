# Shared settings. Profiles: dev (default, direct calls, in-memory H2), local (Eureka + API
# gateway, PostgreSQL), prod (deployment; required values come from the environment).
spring:
  application:
    name: skill-expert-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:${JWT_ISSUER_URI:http://localhost:8443}}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:${JWT_JWK_SET_URI:http://localhost:8443/oauth2/jwks}}
          # Tokens must name this service in aud; one minted for another service is rejected.
          audiences: ${JWT_AUDIENCES:skill-expert-service}

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  tomcat:
    # Profile saves include base64 photos and can exceed the 2MB default.
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    # Off unless a profile turns it on: local registers with Eureka; prod sets
    # EUREKA_CLIENT_ENABLED=true. dev and plain runs call services directly.
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Local sandbox merchant for Skill Expert card and points payments.
# Same id as LocalSkillExpertClubInitializer in loyalty-service. Bill pay does not use this.
# Replace SKILL_EXPERT_MERCHANT_ID when a real IPG merchant is connected.
nmi:
  skill-expert:
    merchant-id: ${SKILL_EXPERT_MERCHANT_ID:22222222-2222-4222-8222-222222222222}

# In-app booking updates (request, offer, confirm, decline, cancel, paid, done) through
# notification-service, sent with this service's own client_credentials token.
# Off until AUTH_CLIENT_SKILL_EXPERT_SERVICE_SECRET is set.
skill-expert:
  notifications:
    enabled: ${SKILL_EXPERT_NOTIFICATIONS_ENABLED:true}
    client-id: skill-expert-service
    client-secret: ${AUTH_CLIENT_SKILL_EXPERT_SERVICE_SECRET:}
    auth-base-url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8443}
    base-url: ${NOTIFICATION_SERVICE_URL:}
    service-id: notification-service
    time-zone: ${SKILL_EXPERT_TIME_ZONE:Asia/Colombo}

logging:
  level:
    root: INFO
    com.nmi.platform.skillexpert: INFO
    org.springframework.security: INFO
