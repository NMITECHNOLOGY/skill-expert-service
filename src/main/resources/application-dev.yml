spring:
  config:
    activate:
      on-profile: dev
    # Local service-to-service secrets (AUTH_CLIENT_*_SECRET) from a file outside the repo, so
    # IDE runs work without env vars. Optional: missing file = env vars only.
    import: optional:file:${user.home}/.nmi/local-service-secrets.properties
  datasource:
    url: jdbc:h2:mem:skill_expert;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:${JWT_ISSUER_URI:http://localhost:8443}}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:${JWT_JWK_SET_URI:http://localhost:8443/oauth2/jwks}}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# No Eureka on dev: call notification-service directly.
skill-expert:
  notifications:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8091}
