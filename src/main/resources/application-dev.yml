spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 15
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}

logging:
  level:
    com.nmi.platform.skillexpert: DEBUG
    org.springframework.security: INFO

management:
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

nmi:
  skill-expert:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://skill-expert-dev.nmi.example}
