spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:skill_expert;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
