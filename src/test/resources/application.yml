spring:
  datasource:
    url: jdbc:h2:mem:skill_expert_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
