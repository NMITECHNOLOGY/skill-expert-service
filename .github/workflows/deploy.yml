name: Deploy Skill Expert Service to AWS

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-skill-expert-service
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nmitecstack/skill-expert-service:latest
            nmitecstack/skill-expert-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/skill-expert-service/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          EUREKA_USERNAME: ${{ secrets.EUREKA_USERNAME }}
          EUREKA_PASSWORD: ${{ secrets.EUREKA_PASSWORD }}
          JWT_ISSUER_URI: ${{ secrets.JWT_ISSUER_URI }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: EUREKA_USERNAME,EUREKA_PASSWORD,JWT_ISSUER_URI
          script: |
            set -euo pipefail
            docker network create superapp_network || true
            cd ~/skill-expert-service
            umask 077
            printf 'EUREKA_USERNAME=%s\nEUREKA_PASSWORD=%s\nJWT_ISSUER_URI=%s\n' \
              "$EUREKA_USERNAME" "$EUREKA_PASSWORD" "$JWT_ISSUER_URI" > .env
            umask 022
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
